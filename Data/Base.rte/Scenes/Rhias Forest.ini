// Rhias Forest


AddScene = Scene
	PresetName = Rhias Forest
	Description = [ 里 亚 斯 森 林 ] 一 片 森 林 垦 地 上 , 散 落 着 几 处 洞 穴 . 在 这 里 , 你 可 以 找 到 大 量 的 黄 金 , 但 必 须 深 入 挖 掘 . 卡 丹 · 里 阿 斯 （ K a r d a n   R h i a s ） 是 国 际 太 空 委 员 会 的 一 名 科 学 家 , 他 是 第 一 个 与 外 星 人 接 触 的 人 类 . 尽 管 因 此 受 到 谴 责 并 随 后 被 解 雇 , 里 阿 斯 还 是 亲 自 会 见 了 一 位 斯 瓦 里 （ S ' v a a r i ） 大 使 , 并 代 表 地 球 与 这 个 外 星 种 族 建 立 了 外 交 关 系 . 多 年 后 ， 随 着 星 际 贸 易 带 来 了 经 济 的 繁 荣 , 里 阿 斯 被 追 授 赦 免 , 现 在 被 大 多 数 人 视 为 英 雄 人 物 .  //A forest clearing with a handful of caves. You can find plenty of gold here, but you'll have to dig in deep. Kardan Rhias, a scientist working for the International Space Commission, was the first human to make contact with aliens. Despite being reprimanded and subsequently fired for doing so, Rhias personally met with a S'vaari ambassador and formed diplomatic ties with the alien race on behalf of Earth. Years later, after intergalactic trade led to a flourishing economy, Rhias was posthumously forgiven, and is now seen by most humans as a heroic figure.
